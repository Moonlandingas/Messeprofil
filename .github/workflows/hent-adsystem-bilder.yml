name: Hent adSystem-bilder

# Laster ned produktbildene som import/bilder-manifest.json peker på (fra shop-api.adsystem.pl),
# skalerer til maks 1000 px og lagrer som webp under bilder/adsystem/. Kjører når manifestet endres,
# eller manuelt. Committer bildene tilbake til main (deploy-workflowen trigges IKKE av bot-commits,
# så neste vanlige push tar bildene med ut).

on:
  push:
    branches: [main]
    paths: ['import/bilder-manifest.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Pillow
        run: pip install --quiet pillow

      - name: Last ned og konverter
        run: |
          python3 - <<'PYEOF'
          import json, os, io, urllib.request, time
          from PIL import Image
          man = json.load(open('import/bilder-manifest.json'))
          ok = skip = feil = 0
          for loc, url in man.items():
              dest = os.path.join('bilder', loc)
              if os.path.exists(dest):
                  skip += 1; continue
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              for forsok in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (messeprofil.no bildeimport)'})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          raw = r.read()
                      im = Image.open(io.BytesIO(raw))
                      if im.mode in ('P', 'LA', 'RGBA'):
                          bg = Image.new('RGB', im.size, (255, 255, 255))
                          bg.paste(im.convert('RGBA'), mask=im.convert('RGBA').split()[-1])
                          im = bg
                      else:
                          im = im.convert('RGB')
                      im.thumbnail((1000, 1000))
                      im.save(dest, 'WEBP', quality=80, method=6)
                      ok += 1
                      break
                  except Exception as e:
                      if forsok == 2:
                          feil += 1
                          print('FEIL', loc, url, e)
                      else:
                          time.sleep(2)
          print(f'lastet ned: {ok}, fantes fra før: {skip}, feil: {feil}')
          PYEOF

      - name: Commit bilder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/adsystem
          if git diff --cached --quiet; then echo "Ingen nye bilder"; exit 0; fi
          git commit -m "Bilder: hentet adSystem-produktbilder fra manifest"
          git push
