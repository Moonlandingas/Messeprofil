name: Hent adSystem-struktur

# Henter kategoristruktur og produktrekkefølge fra adsystem.pl/en (Christian: adSystem er fasit).
# Styres av import/hent-struktur.json. Skriver import/adsystem-struktur/*.

on:
  push:
    branches: [main]
    paths: ['import/hent-struktur.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet beautifulsoup4 lxml
      - name: Hent
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, urllib.error, re, os, time
          from bs4 import BeautifulSoup
          cfg = json.load(open('import/hent-struktur.json'))
          os.makedirs('import/adsystem-struktur', exist_ok=True)
          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128.0 Safari/537.36'}
          logg = []
          def hent(url):
              req = urllib.request.Request(url, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      h = r.read().decode('utf-8', 'ignore'); logg.append(f'{r.status} {len(h)} {url}'); return h
              except urllib.error.HTTPError as e:
                  logg.append(f'HTTP {e.code} {url}'); return ''
              except Exception as e:
                  logg.append(f'FEIL {e} {url}'); return ''
          # 1) sitemaps
          urls = []
          for sm in cfg.get('sitemaps', []):
              x = hent(sm)
              locs = re.findall(r'<loc>(.*?)</loc>', x)
              if locs and all(l.endswith('.xml') for l in locs[:3]):
                  for l in locs:
                      urls += re.findall(r'<loc>(.*?)</loc>', hent(l))
              else:
                  urls += locs
          json.dump(sorted(set(urls)), open('import/adsystem-struktur/sitemap-urls.json', 'w'), indent=0)
          # 2) rå HTML-eksempler
          for navn, url in cfg.get('samples', {}).items():
              h = hent(url)
              open(f'import/adsystem-struktur/sample-{navn}.html', 'w').write(h[:600000])
          # 3) kategorisider: produktlenker i rekkefølge (konfig + alle /en/-kategorier fra sitemap-categories.xml)
          kat = dict(cfg.get('kategorier', {}))
          catxml = hent('https://adsystem.pl/sitemap-categories.xml')
          open('import/adsystem-struktur/sitemap-categories.xml', 'w').write(catxml)
          prodxml = hent('https://adsystem.pl/sitemap-products.xml')
          open('import/adsystem-struktur/sitemap-products.xml', 'w').write(prodxml)
          for u in re.findall(r'<loc>\s*(.*?)\s*</loc>', catxml):
              if '/en/' in u:
                  kat[u.rstrip('/').split('/')[-1]] = u
          import xml.etree.ElementTree as ET
          feed_urls = set(o.attrib.get('url','') for o in ET.parse('import/adsystem-feed.xml').getroot().findall('.//o'))
          IGNORE = {'/en/about','/en/new-in','/en/promotions','/en/adpro','/en/digital','/en/contact','/en/help-center','/en/blog'}
          def les(url):
              h = hent(url)
              if not h: return []
              soup = BeautifulSoup(h, 'lxml')
              links = []
              for a in soup.select('a[href]'):
                  href = a['href']
                  if not re.match(r'^(https?://adsystem\.pl)?/en/[a-z0-9-]+/?$', href): continue
                  href = '/' + href.split('adsystem.pl/')[-1].strip('/') if 'adsystem.pl' in href else href.rstrip('/')
                  t = a.get_text(' ', strip=True)
                  if href in [l['href'] for l in links]: continue
                  links.append({'href': href, 'tekst': t, 'produkt': href[3:] in feed_urls or href[3:]+'/' in feed_urls})
              return links
          struktur = {}
          hoved = list(kat.keys())
          for slug, url in kat.items():
              links = les(url)
              struktur[slug] = {'url': url, 'lenker': links}
              time.sleep(1)
          # undergrupper = lenker på hovedkategorisidene som verken er produkter, hovedkategorier eller IGNORE
          under = []
          for slug in hoved:
              for l in struktur[slug]['lenker']:
                  if not l['produkt'] and l['href'] not in IGNORE and l['href'][4:] not in kat and l['href'] not in under:
                      under.append(l['href'])
          for href in under:
              slug = href[4:]
              if slug in struktur: continue
              struktur[slug] = {'url': 'https://adsystem.pl' + href, 'lenker': les('https://adsystem.pl' + href), 'undergruppe': True}
              time.sleep(1)
          json.dump(struktur, open('import/adsystem-struktur/kategorier.json', 'w'), ensure_ascii=False, indent=1)
          open('import/adsystem-struktur/logg.txt', 'w').write('\n'.join(logg))
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add import/adsystem-struktur
          if git diff --cached --quiet; then echo "Ingen endringer"; exit 0; fi
          git commit -m "Import: hentet adSystem-struktur"
          git push
