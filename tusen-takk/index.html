:root{--red:#D51D29;--red-dark:#B01523;--ink:#16161A;--grey:#5C5054;--grey-200:#EBE5E6;--bg:#FBF4F5}
*{margin:0;padding:0;box-sizing:border-box}
body{font:400 16px/1.6 Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(125deg,#FFFFFF 0%,#FBF4F5 45%,#F6E4E6 100%);min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid var(--grey-200);padding:14px 24px;display:flex;justify-content:center}
header img{height:38px;width:auto}
main{flex:1;display:grid;place-items:center;padding:48px 20px}
.card{background:#fff;border:1px solid var(--grey-200);border-radius:20px;box-shadow:0 24px 60px rgba(142,16,27,.10);padding:52px 44px;max-width:560px;text-align:center}
.check{width:76px;height:76px;border-radius:50%;background:#E8F7EE;display:grid;place-items:center;margin:0 auto 22px;animation:pop .5s cubic-bezier(.2,.7,.3,1.4)}
.check svg{width:38px;height:38px;stroke:#1E7A46;stroke-width:3;fill:none}
@keyframes pop{from{transform:scale(.4);opacity:0}}
h1{font:800 clamp(26px,4vw,34px)/1.15 Montserrat,sans-serif;letter-spacing:-.02em;margin-bottom:12px}
.lead{color:var(--grey);margin-bottom:8px}
.svar{display:inline-block;background:var(--bg);border:1px solid var(--grey-200);border-radius:999px;padding:8px 18px;font:600 13.5px Inter,sans-serif;color:var(--red);margin:14px 0 26px}
.knapper{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 26px;border-radius:999px;font:700 14.5px Montserrat,sans-serif;text-decoration:none;transition:all .15s}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-dark)}
.btn-ghost{border:1.5px solid var(--red);color:var(--red)}
.btn-ghost:hover{background:#FBE9EA}
.kontakt{font-size:14px;color:var(--grey)}
.kontakt a{color:var(--red);font-weight:600;text-decoration:none}
footer{padding:18px;text-align:center;font-size:12.5px;color:var(--grey)}
footer a{color:var(--grey)}

@media (max-width:640px){
  header{flex-direction:column;gap:10px;padding:14px 18px;text-align:center}
  header nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px}
  header nav a{margin-left:0}
  main{padding:28px 18px 60px}
  h1{font-size:clamp(26px,7vw,34px)}
}

<script>
/* Klikksporing: telefon, e-post og forespørsel -> dataLayer (GTM -> Google Ads + Matomo) */
(function(){
  window.dataLayer = window.dataLayer || [];
  function push(ev, method, label){
    window.dataLayer.push({event:ev, kontakt_metode:method, kontakt_verdi:label||'', side:location.pathname});
    if(window._paq){ window._paq.push(['trackEvent','Kontakt', method, label||'', 1]); }
  }
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if(!a || !a.href) return;
    var h = a.getAttribute('href') || '';
    if(h.indexOf('tel:') === 0){ push('kontakt_telefon','telefon', h.replace('tel:','')); }
    else if(h.indexOf('mailto:') === 0){ push('kontakt_epost','epost', h.replace('mailto:','')); }
    else if(h.indexOf('typeform.com') > -1){ push('skjema_apnet','skjema', h); }
  }, true);
})();
</script>
